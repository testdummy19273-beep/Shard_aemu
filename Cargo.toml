[package]
name = "shard"
version = "0.1.0"
edition = "2021"
description = "A lightweight, bloat-free launcher for Google's Android Emulator — play Android games on Windows."
license = "MIT"
publish = false

[lib]
name = "shard"
path = "src/lib.rs"

[[bin]]
name = "Shard"
path = "src/main.rs"

[dependencies]
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.9"
# Event reader only: the SDK manifests are namespaced XML, and a tiny DOM over the reader is
# simpler and stricter than serde mapping for the "pick one package" queries we need.
quick-xml = "0.38"
# native-tls = Windows Schannel. The brief asks for rustls, but rustls needs ring/aws-lc-rs, which
# need a C compiler; this PC builds with the GNU toolchain and no C toolchain. Still no OpenSSL.
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "native-tls"] }
sha1 = "0.10"
sha2 = "0.10"
# Deflate only: the default bzip2/zstd/lzma features compile C code.
zip = { version = "9.0.3", default-features = false, features = ["deflate-flate2-zlib-rs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }
crossbeam-channel = "0.5"
sysinfo = { version = "0.37", default-features = false, features = ["system"] }
png = "0.18"
eframe = { version = "0.36.2", default-features = false, features = ["glow", "default_fonts", "accesskit"] }
# Raw bindings from the windows-rs project (same project as the `windows` crate, smaller and
# with plain C signatures). WinHvPlatform.dll is loaded at runtime, never linked.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
